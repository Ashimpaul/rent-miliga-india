<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Three Roofs Logo Style -->
  <!-- Left Roof -->
  <path d="M10 60 L30 40 L50 60" fill="#4ade80" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right Roof -->
  <path d="M50 60 L70 40 L90 60" fill="#4ade80" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Middle Higher Roof -->
  <path d="M30 50 L50 25 L70 50" fill="#22c55e" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Horizontal Base Line -->
  <line x1="10" y1="65" x2="90" y2="65" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
</svg>